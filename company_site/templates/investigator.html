  <body>
     {% include './navbar.html' %}
    <div class="container" style="margin-top:100px">
        <div class="search-container">

<h1 style="padding-bottom:10px">Search By FDA Investigator</h1>
            <input
                type="text"
                class="search-input"
                placeholder="Search for Invertigator..."
                id="systemSearch"
                autocomplete="off"
            >
            <div class="suggestions-list" id="suggestionsList"></div>
            <div class="selected-systems" id="selectedSystems"></div>
        </div>
        <div id="card-container" class="card-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let selectedSystems = [];
        let companiesData = [];
        let debounceTimer;

         function fetchSuggestions(query) {


                // Ensure data is an array, or access the correct property containing the list
                const companies = [ 'Courtney R Bratina,',
                'Pushpa S Jayasekara','Claude Noel Y Zanetsie','Michael O dowu,',
                'Monica E. Murie',
                'Santos E Camara','Walden H Lee','Michael S Budziak','David J Gomes',
                'Angelica M Hernandez','Megan T Ziegler,',
                'Peng Zhou','Robert J Ham', 'Suzanne N Vallez',
                'Joanne E King','Steven A Brettler,',
                'Burnell M. Henry','Alan L. Truong',
                'Ashar P Parikh','Marcellinus D Dordunoo',
                'Eboni S. Funderburk -S', 'David A. Oluwo','Azeezat M. Lawal',
                'Veronica Fuentes','Libia M Lugo','Demario L Walls','Susan T Hadman,',
                'Michael R. Shanks','Ben Du','Scott Lute,', 'Wen Ning Chan,']

                return companies.filter(system =>
                    system.toLowerCase().includes(query.toLowerCase())
                );

        }

        function showSuggestions(suggestions) {
            const suggestionsList = document.getElementById('suggestionsList');
            suggestionsList.innerHTML = '';

            if (suggestions.length > 0) {
                suggestions.forEach(company => {
                    if (company && typeof company === 'string') {
                        const item = document.createElement('div');
                        item.className = 'suggestion-item';
                        item.textContent = company;
                        item.onclick = () => selectSystem(company);
                        suggestionsList.appendChild(item);
                    }
                });
                suggestionsList.classList.add('active');
            } else {
                suggestionsList.innerHTML = '<div class="suggestion-item text-muted">No matching companies found</div>';
                suggestionsList.classList.add('active');
            }
        }

        function selectSystem(company) {
            if (!selectedSystems.includes(company)) {
                selectedSystems.push(company);
                updateSelectedSystemsTags();
                document.getElementById('systemSearch').value = '';
                document.getElementById('suggestionsList').classList.remove('active');
                fetchData();
            }
        }

        function removeSystem(company) {
            selectedSystems = selectedSystems.filter(s => s !== company);
            updateSelectedSystemsTags();
            fetchData();
        }

        function updateSelectedSystemsTags() {
            const container = document.getElementById('selectedSystems');
            container.innerHTML = selectedSystems.map(company => `
                <div class="system-tag">
                    ${company}
                    <button class="remove-tag" onclick="removeSystem('${company}')">&times;</button>
                </div>
            `).join('');
        }

        function getCSRFToken() {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                  const cookie = cookies[i].trim();
                  if (cookie.startsWith("csrftoken=")) {
                      return cookie.split("=")[1];
                  }
              }
              return "";
          }

        async function fetchData() {
            if (selectedSystems.length === 0) {
                document.getElementById('card-container').innerHTML =
                    '<p class="text-center">Please select at least one company</p>';
                return;
            }

            try {
                const csrfToken = getCSRFToken();
                const response = await fetch('https://icretools.com/aidatabase/company_object/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        "X-CSRFToken": csrfToken
                    },
                    body: JSON.stringify({ investigator_name: selectedSystems })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                companiesData = data.data || [];
                renderCards();
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('card-container').innerHTML =
                    '<p class="text-center text-danger">Error loading data. Please try again.</p>';
            }
        }

        function renderCards() {
            const container = document.getElementById('card-container');
            container.innerHTML = '';

            if (!companiesData || companiesData.length === 0) {
                container.innerHTML = '<p class="text-center">No data available for selected companies</p>';
                return;
            }

            companiesData.forEach(company => {
                const card = createCard(company);
                container.appendChild(card);
            });
        }

        function createCard(company) {
            const card = document.createElement('div');
            card.className = 'data-card';
            const cardId = `card-${createValidId(company.company_name)}`;
            card.id = cardId;

            const years = Object.keys(company.year_of_inspection);

            card.innerHTML = `
                <div class="card-header">
                    <div class="company-name">${company.company_name}</div>
                </div>
                <div class="info-grid">
                    <div class="info-item">
                        <span>Type:</span>
                        <span>${company.type_of_establishment}</span>
                    </div>
                    <div class="info-item">
                        <span>Location:</span>
                        <span>${company.location}</span>
                    </div>
                    <div class="info-item">
                        <span>FDA Observations:</span>
                        <span>${company.total_fda_observation}</span>
                    </div>
                </div>
                <div>
                    <label>Select Years:</label>
                    <div class="year-selector" id="year-selector-${createValidId(company.company_name)}">
                        ${years.map(year => `
                            <div class="year-chip" data-year="${year}">
                                ${year}
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="year-details" id="${cardId}-details"></div>
                <button class="print-button" onclick="printCard('${cardId}')">Print Selected Years</button>
            `;

            const yearSelector = card.querySelector(`.year-selector`);
            yearSelector.addEventListener('click', (e) => {
                const yearChip = e.target.closest('.year-chip');
                if (yearChip) {
                    yearChip.classList.toggle('active');
                    updateYearDetails(cardId);
                }
            });

            return card;
        }

        function updateYearDetails(cardId) {
            const card = document.getElementById(cardId);
            const detailsContainer = document.getElementById(`${cardId}-details`);
            const selectedYears = Array.from(card.querySelectorAll('.year-chip.active')).map(chip => chip.dataset.year);

            if (selectedYears.length === 0) {
                detailsContainer.innerHTML = '';
                return;
            }

            const company = companiesData.find(c => `card-${createValidId(c.company_name)}` === cardId);

            detailsContainer.innerHTML = selectedYears.map(year => {
                const yearData = company.year_of_inspection[year];

                return `
                    <div class="year-section">
                        <h5>Year ${year}</h5>
                        ${Object.entries(yearData).map(([date, data]) => `
                            <div class="inspection-date">
                                <h6>Date: ${date}</h6>
                                <div class="investigator-info">
                                    Investigator: ${data.metadata.fda_investigators}
                                </div>
                                ${Object.entries(data.systems).map(([system, details]) => `
                                    <div class="system-details" onclick="toggleSystemSelection(this)">
                                        <div class="system-name">${system}</div>
                                        <div class="observation-count">
                                                Total Observations: ${details.observation_count}
                                        </div>
                                        <div class="observations-list" style="display:none">
                                            ${Object.entries(details.observations).map(([obsTitle, obsData]) => `
                                                <div class="observation">
                                                    <h6><strong>${obsTitle}</h6>
                                                    ${obsData.contents.map(con => `
                                                        <div class="content-item">

                                                            <p class="content" style="text-align:justify"> ${con.content}</p>
                                                            ${con.image ? `<img src="${con.image}" alt="Observation Image" />` : ''}
                                                        </div>
                                                    `).join('')}
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `).join('')}
                    </div>
                `;
            }).join('');
        }
           // Function to toggle selection of system-details divs
           function toggleSystemSelection(element) {
            element.classList.toggle('selected'); // Toggle selection
        }

        function createValidId(str) {
            return str.toLowerCase()
                     .replace(/[^a-z0-9]/g, '-')
                     .replace(/-+/g, '-')
                     .replace(/^-|-$/g, '');
        }

        function printCard(cardId) {
            const card = document.getElementById(cardId);
            const selectedYears = Array.from(card.querySelectorAll('.year-chip.active')).map(chip => chip.dataset.year);

            if (selectedYears.length === 0) {
                alert('Please select at least one year to print');
                return;
            }

            const printWindow = window.open('', '_blank');
            const companyName = card.querySelector('.company-name').textContent;

            // Clone the details container for printing
            const detailsContainer = document.getElementById(`${cardId}-details`).cloneNode(true);

            // Only keep systems that have the 'selected' class
            detailsContainer.querySelectorAll('.system-details').forEach(system => {
                if (!system.classList.contains('selected')) {
                    system.remove(); // Remove non-selected systems
                } else {
                    const observationsList = system.querySelector('.observations-list');
                    if (observationsList.innerHTML.trim() !== '') {
                        observationsList.style.display = 'block'; // Ensure observations are visible
                    }
                }
            });

            const printContent = `
                <html>
                    <head>
                        <title>Inspection Details - ${companyName}</title>
                        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
                        <style>
                            body { font-family: 'Poppins', sans-serif; padding: 20px; }
                            .company-header { margin-bottom: 20px; }
                            .year-section {
                                margin-bottom: 30px;
                                background: #f8fafc;
                                padding: 20px;
                                border-radius: 8px;
                            }
                            .inspection-date {
                                margin: 15px 0;
                                padding: 15px;
                                background: white;
                                border-radius: 8px;
                                border: 1px solid #e2e8f0;
                            }
                            .system-details {
                                margin-left: 20px;
                                padding-left: 15px;
                                border-left: 2px solid #3b82f6;
                            }
                            .investigator-info {
                                font-style: italic;
                                color: #475569;
                                margin: 10px 0;
                                padding: 8px;
                                background: #f1f5f9;
                                border-radius: 4px;
                            }
                            .observations-list {
                                display: block !important;
                            }
                        </style>
                    </head>
                    <body>
                        <div class="company-header">
                            <h2>${companyName}</h2>
                            <p>Type: ${card.querySelector('.info-item:nth-child(1) span:last-child').textContent}</p>
                            <p>Location: ${card.querySelector('.info-item:nth-child(2) span:last-child').textContent}</p>
                        </div>
                        ${detailsContainer.innerHTML}
                    </body>
                </html>
            `;

            printWindow.document.write(printContent);
            printWindow.document.close();
            printWindow.print();
        }

        document.getElementById('systemSearch').addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            const query = e.target.value.trim();

            if (query.length > 0) {
                debounceTimer = setTimeout(async () => {
                    try {
                        const suggestions =  fetchSuggestions(query);
                        showSuggestions(suggestions);
                    } catch (error) {
                        console.error('Error in search:', error);
                        const suggestionsList = document.getElementById('suggestionsList');
                        suggestionsList.innerHTML = '<div class="suggestion-item text-danger">Error loading suggestions. Please try again.</div>';
                        suggestionsList.classList.add('active');
                    }
                }, 300);
            } else {
                document.getElementById('suggestionsList').classList.remove('active');
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                document.getElementById('suggestionsList').classList.remove('active');
            }
        });
    </script>
