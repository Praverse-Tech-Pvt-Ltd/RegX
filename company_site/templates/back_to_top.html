<style>
  #backToTopBtn {
    position: fixed;
    bottom: 40px;
    right: 40px;
    z-index: 9999;
    width: 50px;
    height: 50px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--blue-lite, #35b1f6), var(--blue-dark, #02283d));
    color: #ffffff;
    font-size: 24px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    transform: translateY(20px);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #backToTopBtn.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  #backToTopBtn:hover {
    background: linear-gradient(135deg, var(--blue-dark, #02283d), var(--blue-lite, #35b1f6));
    transform: translateY(-5px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
  }
  .mdi.mdi-arrow-up {
    font-size: 30px;
  }
</style>

<button id="backToTopBtn" title="Back to top" onclick="window.scrollTo({ top: 0, behavior: 'smooth' });">
  <i class="mdi mdi-arrow-up"></i>
</button>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    var backToTopBtn = document.getElementById("backToTopBtn");
    window.addEventListener("scroll", function() {
      if (window.scrollY > 300) {
        backToTopBtn.classList.add("show");
      } else {
        backToTopBtn.classList.remove("show");
      }
    });
  });
</script>
