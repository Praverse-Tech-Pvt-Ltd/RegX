    <script>
        let selectedYears = [];
        let allCompanies=[]
        let selectedCompnies=[]
        let investigators = [];
        let selectedInvestigators=[]

        const searchInput = document.getElementById("companiesSearch");
        const suggestionsList = document.getElementById("com_suggestionsList");
        const investigatorSearchInput = document.getElementById("investigatorSearchInput");
        const investigatorSuggestionsList = document.getElementById("investigatorSuggestionsList");
        const selectedInvestigatorsContainer = document.getElementById("selectedInvestigators");
        const clearData=document.getElementById("clearData")
        clearData.addEventListener("click",()=>{
            window.location.reload()
        })

        async function fetchCompanies() {
            try {
                const response = await fetch("{{ base_url }}/aidatabase/warning_letter_company/");
                const data = await response.json();
                console.log(data)
                allCompanies=data.companies // Assuming response is an array of company names
            } catch (error) {
                console.error("Error fetching companies:", error);
            }
        }
        searchInput.addEventListener("focus", () => {
            if (allCompanies.length === 0) {
                fetchCompanies().then(() => displayCompanies(allCompanies));
            } else {
                displayCompanies(allCompanies);
            }
            //selectedCompnies.style.display="none"
        });

        // Filter Companies on Input
        searchInput.addEventListener("input", () => {
            const searchTerm = searchInput.value.toLowerCase();
            const filteredCompanies = allCompanies.filter(company =>
                company.toLowerCase().includes(searchTerm)
            );
            displayCompanies(filteredCompanies);
        });

        // Function to Display Companies
        function displayCompanies(companies) {
            suggestionsList.innerHTML = ""; // Clear previous suggestions
            if (companies.length === 0) {

                return;
            }
            suggestionsList.style.display = "block";

            companies.forEach(company => {
                const div = document.createElement("div");
                div.className = "suggestion-item";
                div.textContent = company;
                div.onclick = () => selectCompany(company);
                suggestionsList.appendChild(div);
            });
        }

        // Select a Company from the List
        function selectCompany(company) {

            searchInput.value = company;
            suggestionsList.style.display = "none";
            if (!selectedCompnies.includes(company)) {
              selectedCompnies.push(company);
              updateSelectedSystemsTags()
          }
          else{
            alert("already Selected")
          }
          document.getElementById('companiesSearch').value = '';

        }

      // remover company........
              function removeCompany(company) {
                console.log("for delting",company )
                selectedCompnies = selectedCompnies.filter(s => s !== company);
                  updateSelectedSystemsTags();

              }
              // update the company list........
              function updateSelectedSystemsTags() {
                const container = document.getElementById('selectedCompnies');
                container.innerHTML = ""; // Clear previous content

                selectedCompnies.forEach(company => {
                    const tagDiv = document.createElement("div");
                    tagDiv.className = "system-tag";
                    tagDiv.textContent = company;

                    const removeBtn = document.createElement("button");
                    removeBtn.className = "remove-tag";
                    removeBtn.innerHTML = "&times;";

                    removeBtn.addEventListener("click", () => removeCompany(company)); // Properly attach event

                    tagDiv.appendChild(removeBtn);
                    container.appendChild(tagDiv);
                });
                console.log(selectedCompnies)
                fetchData()
              }

        // Hide Dropdown if Clicked Outside
            document.addEventListener("click", (event) => {
                if (!searchInput.contains(event.target) && !suggestionsList.contains(event.target)) {
                    suggestionsList.style.display = "none";
                }
            });


            const yearList = [
            2020,
            2021,
            2022,
            2023,
            2024,2025 ,
          2026            ];

          initializeSystemSelector();

          function initializeSystemSelector() {
            const selector = document.getElementById('year-selector');
            yearList.forEach(year => {

                const chip = document.createElement('div');
                chip.className = 'year-chip';

                chip.textContent = year;
                chip.onclick = () => toggleYear(chip, year);
                selector.appendChild(chip);
            });
          }

          function toggleYear(chip, year) {
            chip.classList.toggle('active');

            if (chip.classList.contains('active')) {
              if (!selectedYears.includes(year)) {
                selectedYears.push(year);
              }
            } else {
              selectedYears = selectedYears.filter(s => s !== year);
            }

            console.log('Selected years:', selectedYears);
            fetchData()
          }

          async function fetchInvestigator() {
            try {
                 const response = await fetch("{{ base_url }}/aidatabase/issuing_office_list/");
                const data = await response.json();
                console.log("API Response>>>:", data);

                investigators=data.issuing_offices // Assuming response is an array of company names
            } catch (error) {
                console.error("Error fetching companies:", error);
            }
        }

          investigatorSearchInput.addEventListener("focus", () => {

              if (investigators.length === 0) {
                fetchInvestigator().then(() => displayInvestigators(investigators));
            } else {
              displayInvestigators(investigators);
            }


          });

            // Filter inversigator on Input.......................
            investigatorSearchInput.addEventListener("input", () => {
              const searchTerm = investigatorSearchInput.value.toLowerCase();
              const filteredInvestigators = investigators.filter(investigator =>
                  investigator.toLowerCase().includes(searchTerm)
              );
              console.log("filteredInvestigators",filteredInvestigators)
              displayInvestigators(filteredInvestigators);
          });

          // Function to Display inversigator
          function displayInvestigators(investi) {

            investigatorSuggestionsList.innerHTML = ""; // Clear previous suggestions
            if (investi.length === 0) {
                investigatorSuggestionsList.style.display = "none";
                return;
            }
            investigatorSuggestionsList.style.display = "block";

            investi.forEach(investigator => {
                const div = document.createElement("div");
                div.className = "suggestion-item";
                div.textContent = investigator;
                div.onclick = () => selectInvestigator(investigator);
                investigatorSuggestionsList.appendChild(div);
            });
          }

          // Select a inversigator from the List
          function selectInvestigator(investigator) {
            investigatorSuggestionsList.style.display = "none";

            if (!selectedInvestigators.includes(investigator)) {
                selectedInvestigators.push(investigator);
                updateSelectedInvestigatorsTags();
            } else {
                alert("Investigator already selected");
                console.log("Already Selected Investigator ", investigator);
            }

            // Ensure the input field is cleared
            investigatorSearchInput.value = '';
        }
          // remover inversigator........
          function removeInvestigator(investigator) {
            console.log("Removing", investigator);
            selectedInvestigators = selectedInvestigators.filter(s => s !== investigator);
            updateSelectedInvestigatorsTags();
          }
          // update the inversigator list........
          function updateSelectedInvestigatorsTags() {
            const container = document.getElementById('selectedInvestigators');
            container.innerHTML = ""; // Clear previous content

            selectedInvestigators.forEach(investigator => {
                const tagDiv = document.createElement("div");
                tagDiv.className = "system-tag";
                tagDiv.textContent = investigator;

                const removeBtn = document.createElement("button");
                removeBtn.className = "remove-tag";
                removeBtn.innerHTML = "&times;";
                removeBtn.addEventListener("click", () => removeInvestigator(investigator));

                tagDiv.appendChild(removeBtn);
                container.appendChild(tagDiv);
            });
            fetchData()
            console.log(selectedInvestigators);
          }

          // Hide Dropdown if Clicked Outside
          document.addEventListener("click", (event) => {
            if (!investigatorSearchInput.contains(event.target) && !investigatorSuggestionsList.contains(event.target)) {
                investigatorSuggestionsList.style.display = "none";
            }
          });

          async function fetchData() {
            console.log("Fetching data...");
            try {
                const csrfToken = getCSRFToken();
                const response = await fetch('{{ base_url }}/aidatabase/warning_letter_data/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        "X-CSRFToken": csrfToken
                    },
                    body: JSON.stringify({
                        company_name: selectedCompnies,
                        issuing_office: selectedInvestigators,
                        posted_year: selectedYears
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                displayDataInTable(data.data || []);
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('resultsContainer').innerHTML =
                    '<p class="text-center text-danger">Error loading data. Please try again.</p>';
            }
        }

        {% comment %} function displayDataInTable(data) {
            const container = document.getElementById('resultsContainer');
            if (data.length === 0) {

            let tableHTML = `<table border="1">
                <thead>
                    <tr>

                    </tr>
                </thead>
                <tbody>`;

            data.forEach(item => {
                tableHTML += `<tr>
                    <td data-label="Company Name">${item.company_name || ''}</td>
                    <td data-label="Year">${item.posted_date || ''}</td>

                    <td data-label="Issuing Office">${item.issuing_office || ''}</td>
                    <td data-label="Subject">${item.subject || ''}</td>
                    <td data-label="Download">
                        ${item.pdf_path
                            ? `<a href="${item.pdf_path}" download class="btn btn-sm btn-primary">Download</a>`

        function displayDataInTable(data) {
  const container = document.getElementById('resultsContainer');
  if (data.length === 0) {
      container.innerHTML = '<p class="text-center">No data available.</p>';
      return;
  }

  let tableHTML = `<div style="max-height: 500px;overflow-y: auto;"><table border="1" style="width: 100%; border-collapse: collapse;">
      <thead style="position: sticky; top: 0; z-index: 2;">
          <tr style="position: sticky; top: 0; z-index: 2;">
              <th style="width: 20%; text-align: center; position: sticky; top: 0; z-index: 2;">Sr. No.</th>
              <th style="width: 40%; text-align: left; position: sticky; top: 0; z-index: 2;">Company Name</th>
              {% comment %} <th style="text-align: center;position: sticky; top: 0; z-index: 2;">Year</th> {% endcomment %}
              <th style="width: 20%; text-align: center; position: sticky; top: 0; z-index: 2;">Letter Issue Date</th>
              {% comment %} <th style="text-align: center;position: sticky; top: 0; z-index: 2;">Issuing Office</th> {% endcomment %}
              {% comment %} <th style="text-align: center;position: sticky; top: 0; z-index: 2;">Subject</th> {% endcomment %}
              <th style="width: 20%; text-align: center; position: sticky; top: 0; z-index: 2;">Download</th>
          </tr>
      </thead>
      <tbody>`;

  data.forEach((item, index) => {
      tableHTML += `<tr>
          <td style="text-align: center;">${index + 1}</td>
          <td style="text-align: left;">${item.company_name || ''}</td>
          {% comment %} <td style="text-align: center;">${item.posted_date || ''}</td> {% endcomment %}
          <td style="text-align: center;">${item.letter_issue_date || ''}</td>
          {% comment %} <td style="text-align: center;">${item.issuing_office || ''}</td> {% endcomment %}
          {% comment %} <td style="text-align: center;">${item.subject || ''}</td> {% endcomment %}
          <td style="text-align: center;">
              ${item.pdf_path
                  ? `<a href="${item.pdf_path}" download style="padding: 4px 8px; background-color: #085e8e; color: white; text-decoration: none; border-radius: 4px; font-size: 0.875rem;">Download</a>`
                  : '<span style="color: gray;">No file</span>'}
          </td>
      </tr>`;
  });

  tableHTML += `</tbody></table></div>`;
  container.innerHTML = tableHTML;
}




          function getCSRFToken() {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                  const cookie = cookies[i].trim();
                  if (cookie.startsWith("csrftoken=")) {
                      return cookie.split("=")[1];
                  }
              }
              return "";
          }
