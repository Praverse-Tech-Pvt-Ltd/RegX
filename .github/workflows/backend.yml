name: Backend CI

on:
  push:
    branches: [regx-main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [regx-main]
    paths:
      - "backend/**"

jobs:
  test:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: regx_test
          POSTGRES_USER: regx
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Import-linter
        run: lint-imports

      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: regx.settings.test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          MFA_ENCRYPTION_KEY: test_key_not_for_production_use_only_32b
          DB_NAME: regx_test
          DB_USER: regx
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py migrate --noinput

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: regx.settings.test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          MFA_ENCRYPTION_KEY: test_key_not_for_production_use_only_32b
          DB_NAME: regx_test
          DB_USER: regx
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
        run: pytest --tb=short -q

      # The steps below re-run narrow file subsets to prove specific test
      # categories pass in isolation. --no-cov is required: pyproject.toml's
      # addopts enforces --cov-fail-under=55 repo-wide, which a subset can
      # never reach on its own even when every test in it passes. The full
      # suite's coverage gate is already enforced by "Run tests" above.
      - name: Document — upload security tests
        env:
          DJANGO_SETTINGS_MODULE: regx.settings.test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          MFA_ENCRYPTION_KEY: test_key_not_for_production_use_only_32b
          DB_NAME: regx_test
          DB_USER: regx
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
        run: pytest documents/tests/test_validators.py documents/tests/test_storage.py documents/tests/test_scanner.py -v --tb=short --no-cov

      - name: Document — model and permission tests
        env:
          DJANGO_SETTINGS_MODULE: regx.settings.test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          MFA_ENCRYPTION_KEY: test_key_not_for_production_use_only_32b
          DB_NAME: regx_test
          DB_USER: regx
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
        run: pytest documents/tests/test_models.py documents/tests/test_permissions.py -v --tb=short --no-cov

      - name: Document — API and tenant isolation tests
        env:
          DJANGO_SETTINGS_MODULE: regx.settings.test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          MFA_ENCRYPTION_KEY: test_key_not_for_production_use_only_32b
          DB_NAME: regx_test
          DB_USER: regx
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
        run: pytest documents/tests/test_api.py -v --tb=short --no-cov

      - name: Document — Celery task tests
        env:
          DJANGO_SETTINGS_MODULE: regx.settings.test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          MFA_ENCRYPTION_KEY: test_key_not_for_production_use_only_32b
          DB_NAME: regx_test
          DB_USER: regx
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
        run: pytest documents/tests/test_tasks.py -v --tb=short --no-cov

      - name: Templates — model and lifecycle tests
        env:
          DJANGO_SETTINGS_MODULE: regx.settings.test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          MFA_ENCRYPTION_KEY: test_key_not_for_production_use_only_32b
          DB_NAME: regx_test
          DB_USER: regx
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
        run: pytest templates_registry/tests/test_models.py templates_registry/tests/test_lifecycle.py -v --tb=short --no-cov

      - name: Templates — permissions and API/tenant-isolation tests
        env:
          DJANGO_SETTINGS_MODULE: regx.settings.test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          MFA_ENCRYPTION_KEY: test_key_not_for_production_use_only_32b
          DB_NAME: regx_test
          DB_USER: regx
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
        run: pytest templates_registry/tests/test_permissions.py templates_registry/tests/test_api.py -v --tb=short --no-cov

      - name: Templates — source-package/import/normalization/duplicate tests
        env:
          DJANGO_SETTINGS_MODULE: regx.settings.test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          MFA_ENCRYPTION_KEY: test_key_not_for_production_use_only_32b
          DB_NAME: regx_test
          DB_USER: regx
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
        run: pytest templates_registry/tests/test_importer.py -v --tb=short --no-cov

      - name: Templates — planted-failure / governance-integrity tests
        env:
          DJANGO_SETTINGS_MODULE: regx.settings.test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          MFA_ENCRYPTION_KEY: test_key_not_for_production_use_only_32b
          DB_NAME: regx_test
          DB_USER: regx
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
        run: pytest templates_registry/tests/test_planted_failures.py -v --tb=short --no-cov

      - name: FDA data — import, lifecycle, API, and security tests
        env:
          DJANGO_SETTINGS_MODULE: regx.settings.test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          MFA_ENCRYPTION_KEY: test_key_not_for_production_use_only_32b
          DB_NAME: regx_test
          DB_USER: regx
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
        run: pytest fda_data -v --tb=short --no-cov

      - name: Formulations — model, tenant-isolation, and API tests
        env:
          DJANGO_SETTINGS_MODULE: regx.settings.test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          MFA_ENCRYPTION_KEY: test_key_not_for_production_use_only_32b
          DB_NAME: regx_test
          DB_USER: regx
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
        run: pytest formulations -v --tb=short --no-cov

      - name: IID assessment — unit conversion, calculation, matching, and decision engine tests
        env:
          DJANGO_SETTINGS_MODULE: regx.settings.test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          MFA_ENCRYPTION_KEY: test_key_not_for_production_use_only_32b
          DB_NAME: regx_test
          DB_USER: regx
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
        run: pytest iid_assessment -v --tb=short --no-cov

      - name: OpenAPI schema generates and validates
        env:
          DJANGO_SETTINGS_MODULE: regx.settings.test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          MFA_ENCRYPTION_KEY: test_key_not_for_production_use_only_32b
          DB_NAME: regx_test
          DB_USER: regx
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
        # --fail-on-warn is intentionally omitted: this codebase's APIView-based
        # views (predating this milestone, matching documents/authorization/
        # tenancy) produce known, non-blocking "unable to guess serializer"
        # warnings that drf-spectacular gracefully falls back on.
        run: python manage.py spectacular --validate --file /tmp/schema.yml

      - name: Guard — no AIDatabase import
        run: |
          python - <<'PYEOF'
          import re, pathlib, sys
          violations = []
          for p in pathlib.Path('.').rglob('*.py'):
              if '.venv' in str(p) or '__pycache__' in str(p):
                  continue
              src = p.read_text(errors='ignore')
              if re.search(r'^(?:import|from)\s+AIDatabase', src, re.MULTILINE):
                  violations.append(str(p))
          if violations:
              print('FAIL: AIDatabase imported in:', violations)
              sys.exit(1)
          print('OK: No AIDatabase imports found.')
          PYEOF

      - name: Guard — no 483/warning-letter content in templates_registry/fda_data/formulations/iid_assessment migrations
        run: |
          python - <<'PYEOF'
          import re, pathlib, sys
          pattern = re.compile(r'\bform\s*483\b|\b483\s*observation|\bwarning\s*letter\b', re.IGNORECASE)
          violations = []
          for app in ('templates_registry', 'fda_data', 'formulations', 'iid_assessment'):
              for p in pathlib.Path(app, 'migrations').glob('*.py'):
                  src = p.read_text(errors='ignore')
                  if pattern.search(src):
                      violations.append(str(p))
          if violations:
              print('FAIL: 483/warning-letter content referenced in migrations:', violations)
              sys.exit(1)
          print('OK: No 483/warning-letter content baked into governed-domain migrations.')
          PYEOF
