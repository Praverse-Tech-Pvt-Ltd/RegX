name: Frontend CI

on:
  push:
    branches: [regx-main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [regx-main]
    paths:
      - "frontend/**"

jobs:
  build-and-test:
    name: Type-check, lint, build, E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        env:
          CI: true
          BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Guard — no auth token in localStorage
        run: |
          if grep -r "localStorage\.setItem" src/ --include="*.ts" --include="*.tsx" | grep -i "token"; then
            echo "FAIL: Auth token stored in localStorage"
            exit 1
          fi
          echo "OK: No auth token in localStorage"
