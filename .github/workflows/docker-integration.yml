      - name: "IIG checklist execution 4D-2 smoke flow (create execution, submit, approve via production API)"
        run: |
          set -euo pipefail
          docker compose -p regx-ci exec -T backend python manage.py shell -c "
          import json
          from decimal import Decimal

          from django.contrib.auth import get_user_model
          from django.test import Client

          from authorization.models import MembershipRole, Role
          from tenancy.models import Tenant, TenantMembership
          from formulations.models import FormulationVersion, ProductDevelopmentRecord
          from iig_checklist.models import ChecklistDefinition, ChecklistVersion

          User = get_user_model()
          BASE = '/api/regx/v1'

          tenant, _ = Tenant.objects.get_or_create(slug='docker-ci-4d2-smoke', defaults={'name': 'Docker CI 4D-2 Smoke'})

          def make_actor(email, full_name, role_name):
              user, _ = User.objects.get_or_create(email=email, defaults={'full_name': full_name})
              membership, _ = TenantMembership.objects.get_or_create(tenant=tenant, user=user)
              role, _ = Role.objects.get_or_create(tenant=tenant, name=role_name, defaults={'is_system': True})
              MembershipRole.objects.get_or_create(membership=membership, role=role)
              return user

          def api_client(user):
              c = Client(SERVER_NAME='localhost')
              c.force_login(user)
              return c

          doer = make_actor('ci-4d2-doer@example.com', 'CI 4D-2 Doer', 'doer')
          reviewer = make_actor('ci-4d2-reviewer@example.com', 'CI 4D-2 Reviewer', 'reviewer')
          vp = make_actor('ci-4d2-vp@example.com', 'CI 4D-2 VP', 'vp')
          doer_client = api_client(doer)
          reviewer_client = api_client(reviewer)
          vp_client = api_client(vp)
          H = {'HTTP_X_TENANT_SLUG': tenant.slug, 'content_type': 'application/json'}

          # Create a tenant definition and active checklist version.
          defn = ChecklistDefinition.objects.create(
              code='CI-4D2-SMOKE', title='CI 4D-2 Smoke (synthetic)',
              scope_type='tenant', tenant=tenant, created_by=doer,
          )
          cv = ChecklistVersion.objects.create(
              definition=defn, version_number=1, status='active', created_by=doer,
          )
          print('STEP 1 active checklist version created: OK')

          # Create an approved formulation version.
          product = ProductDevelopmentRecord.objects.create(
              tenant=tenant, product_code='CI-4D2-PROD', proposed_product_name='CI 4D-2 Product',
              active_ingredient='Synthetic CI 4D-2 Ingredient', dosage_form='tablet',
              route='oral', created_by=doer,
          )
          fv = FormulationVersion(
              product=product, version_number=1, status='approved',
              total_dosage_unit_weight=Decimal('100'), total_dosage_unit_weight_unit='mg',
              created_by=doer,
          )
          fv.save()
          print('STEP 2 approved formulation version created: OK')

          # Create execution via production API.
          resp = doer_client.post(BASE + '/iig-checklists/executions/', data=json.dumps({
              'checklist_version_public_id': str(cv.public_id),
              'formulation_version_public_id': str(fv.public_id),
          }), **H)
          assert resp.status_code == 201, 'STEP 3 FAIL: execution create returned %s %s' % (resp.status_code, resp.content)
          ex = resp.json()
          assert ex['status'] == 'draft', 'STEP 3 FAIL: execution not in draft, got %s' % ex['status']
          assert 'id' not in ex and 'pk' not in ex, 'STEP 3 FAIL: numeric id leaked in execution response'
          print('STEP 3 execution created in draft (UUID-only response): OK')

          # Duplicate create must return 409.
          resp2 = doer_client.post(BASE + '/iig-checklists/executions/', data=json.dumps({
              'checklist_version_public_id': str(cv.public_id),
              'formulation_version_public_id': str(fv.public_id),
          }), **H)
          assert resp2.status_code == 409, 'STEP 4 FAIL: duplicate execution create returned %s' % resp2.status_code
          print('STEP 4 duplicate active execution rejected with 409: OK')

          # Submit for review.
          epub = ex['public_id']
          resp = doer_client.post(BASE + '/iig-checklists/executions/%s/submit-review/' % epub, **H)
          assert resp.status_code == 200 and resp.json()['status'] == 'submitted_for_review', 'STEP 5 FAIL: submit-review returned %s' % resp.status_code
          print('STEP 5 execution submitted for review: OK')

          # Reviewer returns it.
          resp = reviewer_client.post(BASE + '/iig-checklists/executions/%s/return/' % epub, data=json.dumps({'return_reason': 'Please review Q1.'}), **H)
          assert resp.status_code == 200 and resp.json()['status'] == 'returned', 'STEP 6 FAIL: return returned %s' % resp.status_code
          print('STEP 6 execution returned with reason: OK')

          # Resubmit and approve.
          doer_client.post(BASE + '/iig-checklists/executions/%s/submit-review/' % epub, **H)
          resp = vp_client.post(BASE + '/iig-checklists/executions/%s/approve/' % epub, data=json.dumps({'reviewer_conclusion_note': 'CI 4D-2 smoke approval.'}), **H)
          assert resp.status_code == 200 and resp.json()['status'] == 'approved', 'STEP 7 FAIL: approve returned %s' % resp.status_code
          print('STEP 7 execution approved by VP with conclusion note: OK')

          # Cross-tenant isolation: a user who is ONLY a member of other_tenant cannot see
          # executions that belong to tenant. The requesting user must be a member of the
          # tenant named in the header so TenantMiddleware passes; the view then returns 404
          # because the execution's tenant does not match other_tenant.
          other_tenant, _ = Tenant.objects.get_or_create(slug='docker-ci-4d2-other', defaults={'name': 'Docker CI 4D-2 Other'})
          other_user, _ = User.objects.get_or_create(email='ci-4d2-other@example.com', defaults={'full_name': 'CI 4D-2 Other'})
          other_membership, _ = TenantMembership.objects.get_or_create(tenant=other_tenant, user=other_user)
          other_role, _ = Role.objects.get_or_create(tenant=other_tenant, name='doer', defaults={'is_system': True})
          MembershipRole.objects.get_or_create(membership=other_membership, role=other_role)
          other_client = Client(SERVER_NAME='localhost')
          other_client.force_login(other_user)
          resp_cross = other_client.get(BASE + '/iig-checklists/executions/%s/' % epub, HTTP_X_TENANT_SLUG='docker-ci-4d2-other')
          assert resp_cross.status_code == 404, 'STEP 8 FAIL: cross-tenant access returned %s (must be 404)' % resp_cross.status_code
          print('STEP 8 cross-tenant execution access returns 404: OK')

          print('IIG CHECKLIST EXECUTION 4D-2 SMOKE FLOW: PASS')
          "

