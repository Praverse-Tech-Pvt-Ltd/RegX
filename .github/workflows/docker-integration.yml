name: Docker Integration

on:
  push:
    branches: [regx-main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose.yaml"
      - "infra/**"
      - ".github/workflows/docker-integration.yml"
  pull_request:
    branches: [regx-main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose.yaml"
      - "infra/**"

jobs:
  docker-stack:
    name: Build, start, and verify the production compose stack
    runs-on: ubuntu-latest

    env:
      # Throwaway values for CI only — never real secrets. Compose requires
      # these to be set (see compose.yaml's ":?...required" guards).
      DJANGO_SECRET_KEY: ci-docker-verify-secret-key-not-for-production
      POSTGRES_PASSWORD: ci-docker-verify-password
      MFA_ENCRYPTION_KEY: cVLYzYQ6Zt7wq1V3nq9xQx3v2ZbXK6y8f1s7v3o9m4k=

    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: docker compose -p regx-ci build

      - name: Start the stack
        run: docker compose -p regx-ci up -d

      - name: Wait for postgres and redis to be healthy
        run: |
          for svc in postgres redis; do
            for i in $(seq 1 30); do
              status=$(docker inspect --format='{{.State.Health.Status}}' "regx-ci-${svc}-1" 2>/dev/null || echo "starting")
              [ "$status" = "healthy" ] && break
              sleep 2
            done
            [ "$status" = "healthy" ] || { echo "$svc did not become healthy"; docker compose -p regx-ci logs "$svc"; exit 1; }
          done

      - name: Run migrations
        run: docker compose -p regx-ci exec -T backend python manage.py migrate --noinput

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' regx-ci-backend-1 2>/dev/null || echo "starting")
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          [ "$status" = "healthy" ] || { echo "backend did not become healthy"; docker compose -p regx-ci logs backend; exit 1; }

      - name: Verify readiness reports database and cache OK
        run: |
          resp=$(curl -sf http://localhost:8000/api/regx/v1/readiness/)
          echo "$resp"
          echo "$resp" | grep -q '"status":"ready"' || { echo "readiness not ok"; exit 1; }
          echo "$resp" | grep -q '"database":"ok"' || { echo "database check failed"; exit 1; }
          echo "$resp" | grep -q '"cache":"ok"' || { echo "cache check failed"; exit 1; }

      - name: Verify Celery connected to Redis and is running
        run: |
          sleep 3
          docker compose -p regx-ci logs celery | grep -q "ready\." || { echo "celery worker never reported ready"; docker compose -p regx-ci logs celery; exit 1; }
          status=$(docker inspect --format='{{.State.Status}}' regx-ci-celery-1)
          [ "$status" = "running" ] || { echo "celery is not running: $status"; exit 1; }

      - name: Verify no container has restarted (no crash-loops)
        run: |
          for c in regx-ci-backend-1 regx-ci-celery-1 regx-ci-frontend-1 regx-ci-postgres-1 regx-ci-redis-1; do
            count=$(docker inspect --format='{{.RestartCount}}' "$c")
            echo "$c restarts: $count"
            [ "$count" = "0" ] || { echo "$c has restarted — crash-loop suspected"; exit 1; }
          done

      - name: Verify /signin and /documents return HTTP 200
        run: |
          curl -sf -o /dev/null -w "signin: %{http_code}\n" http://localhost:3000/signin
          curl -sf -o /dev/null -w "documents: %{http_code}\n" http://localhost:3000/documents

      - name: Verify production CSP header is present
        run: |
          curl -sD - -o /dev/null http://localhost:3000/signin | grep -i "content-security-policy" || { echo "CSP header missing"; exit 1; }

      - name: Print service logs on failure
        if: failure()
        run: docker compose -p regx-ci logs

      - name: Tear down (project-scoped only)
        if: always()
        run: docker compose -p regx-ci down --volumes --remove-orphans
