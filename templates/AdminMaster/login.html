{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPharmaAI Login</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- Client JS -->
    <script src="https://cdn.jsdelivr.net/npm/clientjs@latest/dist/client.min.js"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">
  <link rel="shortcut icon" href="{% static 'assets/images/favicon.png' %}" />
    <style>

        *{
            margin:0;
            padding:0;
        }

        body{
            font-family:'Inter',sans-serif;
            min-height:100vh;
            overflow:hidden;
            position:relative;
            background:
                radial-gradient(circle at top left,#05254d 0%,#021325 40%,#010b17 100%);
        }

        .main-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            overflow-y: auto;
        }

        /* Background Glow */

        body::before,
        body::after{
            content:'';
            position:absolute;
            width:500px;
            height:500px;
            border-radius:50%;
            filter:blur(120px);
            opacity:0.18;
            z-index:0;
        }

        body::before{
            background:#1f8fff;
            top:-180px;
            left:-150px;
        }

        body::after{
            background:#00d4ff;
            bottom:-220px;
            right:-150px;
        }

        /* Floating AI Boxes */

        .ai-strip{
            position:absolute;
            border-radius:24px;
            background:rgba(255,255,255,0.03);
            border:1px solid rgba(255,255,255,0.05);
            backdrop-filter:blur(12px);
            animation:float 8s ease-in-out infinite;
        }

        .ai-strip:nth-child(1){
            width:180px;
            height:180px;
            top:60px;
            left:36%;
        }

        .ai-strip:nth-child(2){
            width:90px;
            height:90px;
            top:140px;
            right:28%;
            animation-delay:2s;
        }

        .ai-strip:nth-child(3){
            width:120px;
            height:120px;
            bottom:120px;
            left:18%;
            animation-delay:4s;
        }

        .ai-strip:nth-child(4){
            width:80px;
            height:80px;
            bottom:230px;
            right:16%;
            animation-delay:1s;
        }

        .ai-strip:nth-child(5){
            width:140px;
            height:140px;
            bottom:-20px;
            right:32%;
            animation-delay:5s;
        }

        @keyframes float{
            0%,100%{
                transform:translateY(0px);
            }
            50%{
                transform:translateY(-20px);
            }
        }

        /* Main Wrapper */

        .login-wrapper{
            width:100%;
            max-width:520px;
            padding:20px;
            position:relative;
            z-index:2;
            margin:auto;
        }

        /* Logo */

        .brand{
            margin-bottom: 30px;
            text-align: center;
            width: 100%;
        }

        .brand img {
            height: 75px;
            width: auto;
        }

        /* Top Text */

        .top-text{
            text-align:center;
            margin-bottom:25px;
            color:#d6e4ff;
        }

        .top-text p{
            font-size:16px;
            line-height:1.6;
            font-weight:300;
        }

        /* Glass Card */

        .login-card{
            padding:45px 40px;
            border-radius:30px;
            background:rgba(7,20,40,0.72);
            border:1px solid rgba(255,255,255,0.08);
            backdrop-filter:blur(18px);
            box-shadow:
                0 0 40px rgba(0,0,0,0.35),
                inset 0 0 20px rgba(255,255,255,0.02);
        }

        /* Heading */

        .login-title{
            color:white;
            font-size:42px;
            letter-spacing:5px;
            text-align:center;
            font-family:'Poppins',sans-serif;
            margin-bottom:14px;
        }

        .login-subtitle{
            text-align:center;
            color:#c4d0e0;
            margin-bottom:35px;
            font-size:15px;
        }

        /* Input Group */

        .input-group-custom{
            margin-bottom:24px;
        }

        .input-group-custom label{
            display:block;
            color:#9bb1cb;
            margin-bottom:10px;
            font-size:13px;
            font-weight:600;
            letter-spacing:2px;
        }

        .input-group-custom input{
            width:100%;
            height:50px;
            border-radius:12px;
            border:1px solid rgba(255,255,255,0.08);
            background:rgba(255,255,255,0.06);
            padding:0 16px;
            color:white;
            font-size:14px;
            transition:0.3s;
        }

        .input-group-custom input:focus{
            outline:none;
            border-color:#72a8ff;
            box-shadow:0 0 20px rgba(114,168,255,0.25);
        }

        .input-group-custom input::placeholder{
            color:#9fb1c7;
        }

        /* Login Button */

        .login-btn{
            width:100%;
            height:50px;
            border:none;
            border-radius:12px;
            margin-top:8px;
            background:linear-gradient(135deg,#bfd4ff,#8db2ff);
            color:#0a1d39;
            font-size:16px;
            font-weight:700;
            letter-spacing:2px;
            cursor:pointer;
            transition:0.4s;
        }

        .login-btn:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 30px rgba(120,165,255,0.35);
        }

        /* Forgot */

        .forgot{
            text-align:center;
            margin-top:22px;
        }

        .forgot a{
            color:#c4d0e0;
            text-decoration:none;
            font-size:14px;
        }

        .forgot a:hover{
            color:white;
        }

        /* Footer */

        .footer{
            text-align:center;
            margin-top:40px;
            color:#d3def0;
        }

        .footer p{
            margin-bottom:10px;
        }

        .footer-links{
            display:flex;
            justify-content:center;
            gap:15px;
            font-size:13px;
        }

        .footer-links a{
            color:#9eb6d4;
            text-decoration:none;
        }

        .footer-links a:hover{
            color:white;
        }

        /* Responsive */

        @media(max-width:768px){
            .brand{
                margin-bottom: 20px;
            }

            .brand img {
                height: 40px;
            }

            .login-card{
                padding:35px 20px;
            }

            .login-title{
                font-size:32px;
                letter-spacing:3px;
            }

            .top-text p{
                font-size:14px;
            }

            .ai-strip{
                display:none;
            }
        }

        /* Responsive for small height screens (like 768px height) */
        @media(max-height:800px), (max-width: 576px){
            .main-container {
                padding: 20px 15px;
                display: block; /* Allow scrolling on very small screens */
            }

            .login-wrapper{
                margin: 0 auto;
            }

            .top-text{
                margin-bottom:18px;
            }

            .top-text p{
                font-size:14px;
                line-height:1.4;
            }

            .login-card{
                padding:30px 25px;
            }

            .login-title{
                font-size:32px;
                letter-spacing:3px;
                margin-bottom:10px;
            }

            .login-subtitle{
                font-size:13px;
                margin-bottom:20px;
            }

            .input-group-custom{
                margin-bottom:16px;
            }

            .input-group-custom label{
                margin-bottom:6px;
                font-size:12px;
            }

            .input-group-custom input{
                height:45px;
                font-size:13px;
            }

            .login-btn{
                height:45px;
                font-size:14px;
                margin-top:6px;
            }

            .forgot{
                margin-top:15px;
            }

            .forgot a{
                font-size:12px;
            }

            .footer{
                margin-top:20px;
            }

            .footer p{
                margin-bottom:6px;
                font-size:11px;
            }

            .footer-links{
                font-size:11px;
                gap:10px;
            }
        }

    </style>
</head>

<body>
    <div class="main-container">
        <!-- Brand -->
        <div class="brand">
            <img src="{% static 'assets/icretegy/iPharmaAI_white.png' %}" alt="iPharmaAI">
        </div>

    <!-- Floating AI Boxes -->
    <div class="ai-strip"></div>
    <div class="ai-strip"></div>
    <div class="ai-strip"></div>
    <div class="ai-strip"></div>
    <div class="ai-strip"></div>

    <!-- Main -->
    <div class="login-wrapper">

        {% if message %}
        <script>
            alert("{{ message }}");
        </script>
        {% endif %}

        <!-- Top Text -->
        <div class="top-text">
            <p>
                Revolutionizing Regulatory Affairs with iTechnical Tools.<br>
                Do you want to get started today?
            </p>
        </div>

        <!-- Login Card -->
        <div class="login-card">

            <h1 class="login-title">LOGIN</h1>

            <p class="login-subtitle">
                Please enter your credentials to login.
            </p>

            <p style="color:#ff8f8f; text-align:center; margin-bottom:15px;">
                {{ message }}
            </p>

            <!-- Form -->
            <form method="POST">

                {% csrf_token %}

                <div class="input-group-custom">
                    <label>USERNAME</label>
                    <input type="text"
                           name="username"
                           placeholder="Enter Username">
                </div>

                <div class="input-group-custom">
                    <label>PASSWORD</label>
                    <input type="password"
                           name="password"
                           placeholder="Enter Password">
                </div>

                <input type="hidden"
                       id="footprint_ID"
                       name="footprint_ID">

                <button type="submit" class="login-btn">
                    LOGIN →
                </button>

            </form>

            <!-- Forgot -->


        </div>

        <!-- Footer -->
        <div class="footer">

            <p class="footer-links">
                Powered by<b><a href="https://www.icretegy.com/" target="_blank">iCretegy</a></b>
            </p>

            <div class="footer-links">
                <a href="/privacy-policy/">Privacy Policy</a>
                <span>|</span>
                <a href="/termsofuse/">Terms of Use</a>
            </div>

        </div>

    </div>
    </div>

    <!-- Fingerprint -->
    <script>

        function setFingerprint() {

            const client = new ClientJS();

            const fingerprint = client.getFingerprint();

            document.getElementById('footprint_ID').value = fingerprint;

            console.log(fingerprint);
        }

        window.onload = setFingerprint;

    </script>

</body>

</html>
