{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Systems Checklist</title>
<link rel="stylesheet" href="{% static 'assets/vendors/mdi/css/materialdesignicons.min.css' %}">
  <link rel="stylesheet" href="{% static 'assets/vendors/ti-icons/css/themify-icons.css' %}">
  <link rel="stylesheet" href="{% static 'assets/vendors/css/vendor.bundle.base.css' %}">
  <link rel="stylesheet" href="{% static 'assets/vendors/font-awesome/css/font-awesome.min.css' %}">
  <!-- endinject -->
  <!-- Plugin css for this page -->
  <link rel="stylesheet" href="{% static 'assets/vendors/font-awesome/css/font-awesome.min.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/vendors/bootstrap-datepicker/bootstrap-datepicker.min.css' %}">
  <!-- End plugin css for this page -->
  <!-- Layout styles -->
  <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
  <!-- End layout styles -->
  <link rel="shortcut icon" href="{% static 'assets/images/favicon.png' %}" />

  <style>

* {
  scrollbar-width: thin !important;
  scrollbar-color: #015a8b transparent !important;
}
    :root {
      --bg-1: #ffffff;
      --bg-2: #e8d8ff;
      --ink: #17324d;
      --accent: #25729D;
      --accent-2: #9866fd;
      --card: rgba(255,255,255,0.82);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      /* background: linear-gradient(90deg, var(--bg-1), var(--bg-2)); */
    }

    a { text-decoration: none; }

    .nav-link {
      white-space: normal !important;
      word-wrap: break-word !important;
      overflow-wrap: break-word !important;
      text-align: left !important;
    }

    .nav-header-link {
      font-size: 14px !important;
      font-weight: bold;
      text-decoration: none;
      border-radius: 5px;
      color: black !important;
    }

    .nav-header-link-hover:hover {
      color: #045c8d !important;
    }

    .active-header-link {
      color: rgba(255, 255, 255, 1) !important;
      background: linear-gradient(to right, #045c8d, #3485b3) !important;
    }

    .navbar-menu-wrapper {
      padding-left: 0px !important;
      padding-right: 0px !important;
      flex-grow: 1;
    }

    .navbar-brand-wrapper {
      width: fit-content !important;
    }

    .navbar-menu-wrapper {
      width: fit-content !important;
    }

    .dropdown-item:active {
      background-color: white;
    }

    .dropdown-menu[data-bs-popper] {
      top: 70%;
    }

    @media (max-width: 1490px) {
      .nav-header-link {
        font-size: 12px !important;
      }
    }

    /* ── Dashboard sidebar layout ── */
    .dashboard-page-body {
      display: flex;
      align-items: stretch;
      gap: 0;
      padding-top: 70px;
      min-height: 100vh;
    }



    .dashboard-main-panel {
      flex: 1 1 auto;
      margin-left: 250px;
    width: calc(100% - 250px);
    transition: all 0.3s ease;
    }
/* When sidebar collapsed */
    .dashboard-layout.sidebar-collapsed .main-panel {
        margin-left: 80px;
        width: calc(100% - 80px);
    }
    /* Collapsed sidebar */
    .dashboard-layout.sidebar-collapsed .dashboard-sidebar {
      width: 96px;
      min-width: 96px;
      max-width: 96px;
    }
    .dashboard-layout.sidebar-collapsed .dashboard-sidebar-link {
      justify-content: center;
      padding-left: 0;
      padding-right: 0;
    }
    .dashboard-layout.sidebar-collapsed .dashboard-sidebar-label { display: none; }
    .dashboard-layout.sidebar-collapsed .sidebar-toggle-row { justify-content: center; }
    .dashboard-layout.sidebar-collapsed .dashboard-sidebar-item {
      display: flex;
       flex-direction: column;
      justify-content: center;
    }
    .dashboard-layout.sidebar-collapsed .dashboard-sidebar-link {
      width: 56px;
      margin: 0 auto;
    }

    .content {
      flex: 1;
      min-width: 0;
      padding: 28px 28px 36px;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .hero h1 {
      margin: 0 0 6px;
      font-size: 30px;
      font-weight: 800;
      color: #21415f;
    }

    .hero p {
      margin: 0;
      max-width: 840px;
      color: #42607b;
      line-height: 1.55;
    }

    .hero-meta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(8, 177, 209, 0.14);
      border-radius: 16px;
      font-weight: 700;
      color: #2f5678;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      align-items: stretch;
    }

    .card {
      position: relative;
      border-radius: 20px;
      padding: 18px 18px 16px;
      background: rgba(255, 255, 255, 0.97);
      min-height: 255px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(24, 53, 88, 0.05);
      border: 1px solid #d9e2ee;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .card-system-label {
      margin-bottom: 16px;
      color: #146694;
      font-size: 12px;
      font-weight: 700;
      {% comment %} letter-spacing: 0.18em; {% endcomment %}
      text-transform: uppercase;
      font-family: 'Material Design Icons';
    }

    .card-headerr {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }

    .card-icon {
      width: 62px;
      height: 62px;
      border-radius: 16px;
      background: linear-gradient(180deg, #e9faf6, #dff3ee);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      overflow: hidden;
      border: 0;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .card-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-icon.has-image {
      background: #ffffff;
      border: 1px solid #e3eaf3;
    }

    .card-icon i {
      font-size: 30px;
      color: var(--icon-color, #6e7fc2);
    }

    .card-meta {
      display: contents;
    }

    .card-bodies h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.12;
      color: #1c2733;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .card-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.22;
      color: #0f2d57;
      min-height: auto;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-title .title-line {
      display: inline;
    }

    .card-title .title-line + .title-line::before {
      content: " ";
    }

    .card-title.is-two-line {
      display: flex;
      flex-direction: column;
      gap: 0;
      white-space: normal;
      overflow: visible;
      text-overflow: unset;
    }

    .card-title.is-two-line .title-line {
      display: block;
    }

    .card-title.is-two-line .title-line + .title-line::before {
      content: "";
    }

    .card-bodies {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      margin: 0 4px;

    }

    .card-bodies p {
      margin: 0;
      line-height: 1.55;
      font-size: 14px;
      color: #7b8fa9;
      font-weight: 400;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
    }

    .card-tag {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: #dbf4ee;
      color: #0b7d77;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .card-footeres {
      margin-top: auto;
      padding-top: 14px;
      /* border-top: 1px solid #e7edf5; */
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-footeres-meta {
      color: #6f84a2;
      font-size: 12px;
      line-height: 1.6;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: auto;
      padding: 10px 14px;
      border-radius: 10px;
      background: #10284c;
      color: white;
      font-size: 12px;
      font-weight: 700;
      border: 0;
      box-shadow: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      justify-content: center;
    }

    .download-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
      box-shadow: 0 12px 22px rgba(16, 40, 76, 0.14);
    }

    .download-btn i {
      width: auto;
      height: auto;
      border-radius: 0;
      display: inline-block;
      background: transparent;
      font-size: 16px;
    }

    .download-btn-text {
      flex: 0 0 auto;
      text-align: left;
      font-size: 12px;
      letter-spacing: 0.01em;
    }

    .download-btn-separator,
    .download-btn-caret {
      display: none;
    }

    .download-btn.disabled,
    .download-btn[aria-disabled="true"] {
      pointer-events: none;
      opacity: 0.68;
      box-shadow: none;
      background: linear-gradient(180deg, #8da0bd, #768cab);
    }

    .empty-state, .error-state {
      padding: 24px;
      border-radius: 18px;
      background: rgba(255,255,255,0.8);
      border: 1px solid rgba(8, 177, 209, 0.18);
      color: #31506d;
    }

    .error-state {
      border-color: rgba(219, 65, 65, 0.25);
      color: #8b1f1f;
    }

    .skeleton {
      min-height: 258px;
      border-radius: 22px;
      background: linear-gradient(90deg, rgba(255,255,255,0.74), rgba(240,247,255,0.92), rgba(255,255,255,0.74));
      background-size: 200% 100%;
      animation: shimmer 1.25s infinite linear;
      box-shadow: 0 18px 40px rgba(15, 53, 92, 0.08);
    }

    @keyframes shimmer {
      0% { background-position: 0 0; }
      100% { background-position: 200% 0; }
    }

    .theme-1 { --icon-bg: #e6f1ff; --icon-color: #2f78d3; }
    .theme-2 { --icon-bg: #dff7ea; --icon-color: #23915f; }
    .theme-3 { --icon-bg: #fff0d9; --icon-color: #eea33d; }
    .theme-4 { --icon-bg: #e2f0ff; --icon-color: #3178c8; }
    .theme-5 { --icon-bg: #fff0d8; --icon-color: #ea9a34; }
    .theme-6 { --icon-bg: #ddf3f4; --icon-color: #2b9aa9; }

    @media (min-width: 1600px) {
      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 1350px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: auto;
      }
    }

    @media (max-width: 991px) {
      .dashboard-page-body {
        flex-direction: column;
        padding-top: 70px;
      }
      .dashboard-sidebar {
        position: relative;
        top: 0;
        width: 100%;
        min-width: 100%;
        max-width: 100%;
        height: auto;
        border-radius: 0 0 16px 16px;
      }
      .dashboard-layout.sidebar-collapsed .dashboard-sidebar {
        width: 100%;
        min-width: 100%;
        max-width: 100%;
      }
      .dashboard-main-panel {
        width: 100% !important;
      }
      .content {
        padding: 22px 16px 28px;
      }
      .hero {
        flex-direction: column;
        align-items: flex-start;
      }
      .card-footeres {
        flex-direction: column;
        align-items: stretch;
      }
      .download-btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
 {% include './navbar.html' %}

  <div class="container-fluid page-body-wrapper dashboard-page-body dashboard-layout" id="dashboardLayout">
     {% include './sidebar.html' %}

    <div class="main-panel dashboard-main-panel">
    <main class="content">
      <section class="hero">
        <div>
          <h2 >Systems Checklist Library</h2>
          <p>
            Browse the six FDA cGMP systems and download the latest checklist PDF for each active system.
          </p>
        </div>
        <!-- <div class="hero-meta" id="systemsMeta">Loading checklists...</div> -->
      </section>

      <section id="systemsGrid" class="grid" aria-live="polite">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </section>
    </main>
    </div>
  </div>

  <script>
    const SYSTEMS = [
      { system_name: "Quality System", iconClass: "mdi-shield-check-outline", themeClass: "theme-1" },
      { system_name: "Facilities & Equipment System", iconClass: "mdi-factory", themeClass: "theme-2" },
      { system_name: "Materials System", iconClass: "mdi-cube-outline", themeClass: "theme-3" },
      { system_name: "Production System", iconClass: "mdi-cogs", themeClass: "theme-4" },
      { system_name: "Packaging & Labeling System", iconClass: "mdi-package-variant-closed", themeClass: "theme-5" },
      { system_name: "Laboratory Control System", iconClass: "mdi-flask-outline", themeClass: "theme-6" },
    ];

    function sanitizeFileName(name) {
      return name
        .replace(/[^a-z0-9]+/gi, "_")
        .replace(/^_+|_+$/g, "");
    }

    function getSuggestedDownloadName(systemName, apiFileName) {
      if (apiFileName) return apiFileName;
      return `${sanitizeFileName(systemName)}_Checklist_v1.pdf`;
    }

    function formatTitleTwoLines(text) {
      const words = String(text || "").trim().split(" ").filter(Boolean);
      if (words.length <= 1) {
        return `<span class="title-line">${text}</span>`;
      }

      const splitIndex = words.length <= 2 ? 1 : words.length - 2;
      const firstLine = words.slice(0, splitIndex).join(" ");
      const secondLine = words.slice(splitIndex).join(" ");
      return `<span class="title-line">${firstLine}</span><span class="title-line">${secondLine}</span>`;
    }

    function readBaseUrl() {
      return window.location.origin;
    }

    function getSystemShortLabel(index) {
      return `System ${String(index + 1).padStart(2, "0")}`;
    }

    function getSystemTags(systemName) {
      const tagMap = {
        "Quality System": ["CAPA", "Deviation Mgmt", "Management Review"],
        "Facilities & Equipment System": ["Calibration", "Maintenance", "Qualification"],
        "Materials System": ["Vendor Control", "Sampling", "Storage"],
        "Production System": ["Batch Review", "In-Process", "Yield Control"],
        "Packaging & Labeling System": ["Line Clearance", "Reconciliation", "Artwork"],
        "Laboratory Control System": ["Specifications", "OOS", "Stability"]
      };

      return tagMap[systemName] || ["Checklist", "PDF", "Compliance"];
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatCardDescription(text, maxLength = 500) {
      const normalized = String(text || "").replace(/\s+/g, " ").trim();
      if (normalized.length <= maxLength) {
        return escapeHtml(normalized);
      }

      return `${escapeHtml(normalized.slice(0, maxLength).trimEnd())}...`;
    }

    function buildCard(system, item, index) {
      const hasFile = Boolean(item && item.file);
      const hasApiIcon = Boolean(item && item.icon);
      const downloadName = getSuggestedDownloadName(system.system_name, item && item.filename);
      const systemLabel = getSystemShortLabel(index);
      const useTwoLineTitle = index === 1 || index === 4;
      const tags = getSystemTags(system.system_name);
      const tagsHtml = tags.map((tag) => `<span class="card-tag">${escapeHtml(tag)}</span>`).join("");
      const iconHtml = hasApiIcon
        ? `<img src="${item.icon}" alt="${system.system_name} icon">`
        : `<i class="mdi ${system.iconClass}"></i>`;

      const description = (item && item.description) ? item.description : "Checklist details will appear here once the active checklist is uploaded.";
      const formattedDescription = formatCardDescription(description, 500);
      const fileUrl = hasFile ? item.file : "#";
      const footerMeta = hasFile ? "" : "File not uploaded yet";
      const fileType = (item && item.file_type) ? item.file_type.toUpperCase() : "PDF";

      return `
        <article class="card ${system.themeClass}">
          <div class="card-system-label">${systemLabel}</div>
          <div class="card-headerr">
            <div class="card-icon ${hasApiIcon ? "has-image" : ""}">${iconHtml}</div>
            <div class="card-meta"></div>
          </div>
          <div class="card-bodies">
            <h2 class="card-title ${useTwoLineTitle ? "is-two-line" : ""}">${formatTitleTwoLines(system.system_name)}</h2>
            <p title="${escapeHtml(description)}">${formattedDescription}</p>
            <!-- <div class="card-tags">${tagsHtml}</div> -->
          </div>
          <div class="card-footeres">
            <div class="card-footeres-meta">
              ${hasFile ? `<span class="badge bg-light text-dark border me-1">${fileType}</span>
              <span class="badge bg-light text-dark border me-1">${item.page_len || 0} Pages</span><span class="badge bg-light text-dark border me-1">100 Questions</span>` : ""}
              ${footerMeta}
            </div>
            <button class="download-btn ${hasFile ? "" : "disabled"}" type="button" data-file-url="${fileUrl}" data-file-name="${downloadName}" ${hasFile ? "" : 'aria-disabled="true"'}>
              <i class="mdi mdi-download"></i>
              <span class="download-btn-text">Download</span>
              <span class="download-btn-separator" aria-hidden="true"></span>
              <span class="download-btn-caret" aria-hidden="true">&#9662;</span>
            </button>
          </div>
        </article>
      `;
    }

    function initSidebarToggle() {
      const layout = document.getElementById("dashboardLayout");
      const btn = document.getElementById("sidebarToggle");
      if (!layout || !btn) return;

      const storageKey = "systemsSidebarCollapsed";
      const saved = localStorage.getItem(storageKey) === null ? false : localStorage.getItem(storageKey) === "true";

      function applyState(collapsed) {
        layout.classList.toggle("sidebar-collapsed", collapsed);
        btn.setAttribute("aria-expanded", String(!collapsed));
        btn.innerHTML = '<i class="mdi mdi-dock-left"></i>';
      }

      applyState(saved);
      btn.addEventListener("click", () => {
        const next = !layout.classList.contains("sidebar-collapsed");
        localStorage.setItem(storageKey, String(next));
        applyState(next);
      });
    }

    async function loadSystems() {
      const grid = document.getElementById("systemsGrid");
      const meta = document.getElementById("systemsMeta");
      const endpoint = `${readBaseUrl()}/aidatabase/system_checklist/`;

      try {
        const response = await fetch(endpoint, { headers: { "Accept": "application/json" } });
        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }

        const payload = await response.json();
        const checklists = Array.isArray(payload.checklists) ? payload.checklists : [];
        const lookup = new Map(checklists.map((item) => [item.system_name, item]));

        grid.innerHTML = SYSTEMS.map((system, index) => buildCard(system, lookup.get(system.system_name), index)).join("");
        //meta.textContent = `${checklists.length} active checklist${checklists.length === 1 ? "" : "s"} loaded`;
        bindDownloadButtons();
      } catch (error) {
        console.error("Failed to load checklist data:", error);
        grid.innerHTML = `
          <div class="error-state">
            We could not load checklist data from <code>/aidatabase/system_checklist/</code>.
            Please try again after confirming the API is reachable.
          </div>
        `;
        meta.textContent = "Load failed";
      }
    }

    function bindDownloadButtons() {
      document.querySelectorAll(".download-btn[data-file-url]").forEach((button) => {
        if (button.getAttribute("aria-disabled") === "true") return;

        button.addEventListener("click", async () => {
          const fileUrl = button.getAttribute("data-file-url");
          const fileName = button.getAttribute("data-file-name") || "Checklist.pdf";
          const originalHtml = button.innerHTML;

          try {
            button.disabled = true;
            button.innerHTML = '<i class="mdi mdi-loading mdi-spin"></i> Preparing...';

            const response = await fetch(fileUrl);
            if (!response.ok) {
              throw new Error(`Download failed with status ${response.status}`);
            }

            const blob = await response.blob();
            const objectUrl = window.URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = objectUrl;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            link.remove();
            window.URL.revokeObjectURL(objectUrl);
          } catch (error) {
            console.error("Download error:", error);
            window.alert("We could not download the checklist right now. Please try again.");
          } finally {
            button.disabled = false;
            button.innerHTML = originalHtml;
          }
        });
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      initSidebarToggle();
      loadSystems();
    });
  </script>
  <script src="{% static 'assets/vendors/js/vendor.bundle.base.js' %}"></script>
  <script src="{% static 'assets/js/misc.js' %}"></script>
  <script src="{% static 'assets/js/settings.js' %}"></script>
  <script src="{% static 'assets/js/todolist.js' %}"></script>
  <script src="{% static 'assets/js/jquery.cookie.js' %}"></script>
</body>
</html>
