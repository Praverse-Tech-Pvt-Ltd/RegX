name: regx

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: regx
      POSTGRES_USER: regx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regx"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: regx.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      # Malware scanning. This stack runs regx.settings.production, which
      # refuses to start on the stub scanner unless the escape hatch below is
      # set. LOCAL DEVELOPMENT ONLY -- remove DOCUMENT_SCANNER_ALLOW_STUB from
      # any deployed environment, and set DOCUMENT_SCANNER_BACKEND=clamav.
      # For real scanning locally: docker compose --profile scanning up -d
      # then set DOCUMENT_SCANNER_BACKEND=clamav here.
      DOCUMENT_SCANNER_BACKEND: ${DOCUMENT_SCANNER_BACKEND:-stub}
      DOCUMENT_SCANNER_ALLOW_STUB: ${DOCUMENT_SCANNER_ALLOW_STUB:-true}
      DOCUMENT_CLAMAV_HOST: ${DOCUMENT_CLAMAV_HOST:-clamav}
      DOCUMENT_CLAMAV_PORT: ${DOCUMENT_CLAMAV_PORT:-3310}
      DB_HOST: postgres
      DB_NAME: regx
      DB_USER: regx
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      # Tags every structured log line so backend and worker output can be told
      # apart -- they run the same image with the same settings.
      REGX_SERVICE_NAME: backend
    volumes:
      - document_storage:/app/document_storage
      # common/tests/test_task_reliability_doc.py checks that
      # docs/TASK_RELIABILITY.md still describes the tasks the code declares. It
      # resolves the file as parents[3] of the test, which in a source checkout
      # is <repo>/docs. The image copies only backend/, so /app is the
      # equivalent of <repo>/backend and / is the equivalent of <repo> -- which
      # makes /docs the right path, just an empty one. Mounting the real
      # directory there read-only lets those six tests run in the container
      # without putting documentation into the image.
      - ./docs:/docs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/regx/v1/health/')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A regx worker --loglevel=info
    environment:
      DJANGO_SETTINGS_MODULE: regx.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      # Malware scanning. This stack runs regx.settings.production, which
      # refuses to start on the stub scanner unless the escape hatch below is
      # set. LOCAL DEVELOPMENT ONLY -- remove DOCUMENT_SCANNER_ALLOW_STUB from
      # any deployed environment, and set DOCUMENT_SCANNER_BACKEND=clamav.
      # For real scanning locally: docker compose --profile scanning up -d
      # then set DOCUMENT_SCANNER_BACKEND=clamav here.
      DOCUMENT_SCANNER_BACKEND: ${DOCUMENT_SCANNER_BACKEND:-stub}
      DOCUMENT_SCANNER_ALLOW_STUB: ${DOCUMENT_SCANNER_ALLOW_STUB:-true}
      DOCUMENT_CLAMAV_HOST: ${DOCUMENT_CLAMAV_HOST:-clamav}
      DOCUMENT_CLAMAV_PORT: ${DOCUMENT_CLAMAV_PORT:-3310}
      DB_HOST: postgres
      DB_NAME: regx
      DB_USER: regx
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      REGX_SERVICE_NAME: celery
    volumes:
      - document_storage:/app/document_storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # A live process is not a live worker. SIGSTOP the worker and the
      # container still reports "running" while nothing is consumed at all, so
      # the probe has to ask the worker itself to answer over the broker.
      #
      # -d celery@... targets THIS worker by nodename. A bare `inspect ping` is
      # a broadcast that succeeds if ANY worker replies, which would report a
      # dead worker healthy the moment a second one existed; it also waits out
      # the full --timeout collecting replies (5.8s measured) instead of
      # returning on the first (0.5s).
      #
      # $$(hostname), not $$HOSTNAME: HOSTNAME is absent from this container's
      # Config.Env -- it is injected on the exec path, not declared -- so a
      # healthcheck could see it empty, target the node "celery@" that never
      # replies, and pin the service unhealthy forever. `hostname` reads the
      # UTS namespace, which is what celery uses for its nodename. The doubled
      # $$ escapes compose interpolation so the container's shell expands it
      # rather than compose expanding it from the host environment.
      #
      # Output is discarded and replaced with one fixed line: the failure path
      # is a ~120-line Python traceback. It was checked with a password in the
      # broker URL and did not contain it, but keeping arbitrary library text
      # out of `docker inspect` health logs is the safer default.
      test: ["CMD-SHELL", "celery -A regx inspect ping -d celery@$$(hostname) --timeout 5 >/dev/null 2>&1 || { echo 'celery worker did not reply to inspect ping'; exit 1; }"]
      interval: 20s
      timeout: 10s
      retries: 3
      # Measured cold start to first successful ping: ~6s locally. 30s leaves
      # room for a slower CI runner without hiding a real failure for minutes.
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Must be a build arg, not just runtime env: Next.js inlines
        # NEXT_PUBLIC_* into the client bundle when it builds.
        NEXT_PUBLIC_API_URL: ${INTEGRATED_APP_URL:-http://localhost:8080}
    restart: unless-stopped
    environment:
      # Same-origin through nginx: the browser calls /api/regx/v1/... on
      # :8080 and never crosses an origin, so the frontend CSP's connect-src
      # 'self' covers it and no CORS preflight is involved.
      NEXT_PUBLIC_API_URL: ${INTEGRATED_APP_URL:-http://localhost:8080}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    healthcheck:
      # 127.0.0.1, not localhost: node:22-alpine resolves localhost to ::1
      # first and Next binds 0.0.0.0 (IPv4 only), so a localhost probe is
      # refused outright -- verified in this image, and the same trap that once
      # had nginx reporting unhealthy while it was serving every request.
      #
      # /signin, not /: it is the frontend's real entry route through nginx
      # (nginx gives / to the company site, so / is a page nobody reaches),
      # it needs no session, and it is a client component -- rendering it makes
      # no backend call. The probe therefore reports on the frontend alone,
      # which is what a per-service health signal should do. wget exits
      # non-zero on any HTTP error status, so a 404 or 500 fails the probe.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/signin || { echo 'frontend did not serve /signin'; exit 1; }"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Measured cold start to first 200: ~1s locally.
      start_period: 15s

  # The company website (booking-demo-final), carried in verbatim and run as
  # its own service. It keeps its own SQLite database and is completely
  # separate from the REGX Postgres instance.
  company_site:
    build:
      context: ./company_site
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: RAAI.settings_integration
      DEBUG: "False"
      SECRET_KEY: ${COMPANY_SECRET_KEY:?COMPANY_SECRET_KEY is required}
      ALLOWED_HOSTS: localhost,127.0.0.1,company_site,nginx
      # 8090 is a separate browser origin from 8080. nginx forwards
      # `Host $$host` without the port, so Django cannot match the POST's
      # Origin against the request host and falls through to this list.
      # Omitting 8090 makes every POST on the admin listener -- the login
      # included -- fail CSRF with a 403 while GETs still return 200.
      CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:8090,http://127.0.0.1:8090
      COMPANY_REDIS_URL: redis://redis:6379/1
      COMPANY_DB_PATH: /app/data/db.sqlite3
      # Required by AIDatabase.context_processors.base_url, which runs on
      # every company template render and has no default — the company
      # supplies it through the .env we deliberately did not copy (it holds
      # their SECRET_KEY). Points at the nginx origin, not the container.
      BASE_URL: ${COMPANY_BASE_URL:-http://localhost:8080}
      # Read by AdminMaster.views.login. "LOCAL" is what the company's own
      # .env uses and keeps their local login behaviour; "PRODUCTION" turns
      # on their device-token second step for non-internal users. Left
      # overridable so a real deployment can opt into the stricter path.
      SERVER: ${COMPANY_SERVER_MODE:-LOCAL}
      # Makes the company login delegate to REGX, so one credential set opens
      # both applications. Container-to-container, so it names the backend
      # service rather than the nginx origin. Blank disables the delegation and
      # the login checks passwords locally, as it did before.
      REGX_AUTH_URL: ${REGX_AUTH_URL:-http://backend:8000}
    volumes:
      # The SQLite file lives in a named volume so company logins, demo
      # bookings and session rows survive an image rebuild. docker-entrypoint.sh
      # seeds it from the copied db.sqlite3 on first start.
      - company_db:/app/data
      # media/ is excluded from the image (see .dockerignore) and bind-mounted
      # instead, so uploads written by the app are the same bytes nginx serves
      # from /media/ rather than a divergent copy inside the container.
      - ./company_site/media:/app/media
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/termsofuse/')\""]
      interval: 15s
      timeout: 10s
      retries: 10

  # Single origin for the integrated application. This is the URL to open.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Read-only mounts of the copied company asset trees so nginx serves
      # them straight off disk instead of proxying 685 MB through Django.
      - ./company_site/static:/srv/company/static:ro
      - ./company_site/media:/srv/company/media:ro
    depends_on:
      - company_site
      - frontend
      - backend
    ports:
      - "8080:8080"
      # Admin listener, deliberately a separate published port so it can be
      # dropped from a deployment, bound to an internal interface, or put
      # behind a different firewall rule without touching 8080.
      - "8090:8090"
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1
      # first, and nginx listens on 0.0.0.0 only, so the check reported the
      # container unhealthy while it was serving every request fine.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Real malware scanning. Behind a profile because the image pulls a large
  # signature database and takes minutes to become healthy -- adding that to
  # the default stack would slow every developer start and the CI compose job
  # for a service most local work never exercises.
  #   docker compose --profile scanning up -d clamav
  # Then set DOCUMENT_SCANNER_BACKEND=clamav for backend and celery.
  clamav:
    image: clamav/clamav:1.3
    profiles: ["scanning"]
    restart: unless-stopped
    healthcheck:
      # clamdcheck talks to the running daemon; freshclam must finish first,
      # hence the long start_period.
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

volumes:
  postgres_data:
  document_storage:
  company_db:
