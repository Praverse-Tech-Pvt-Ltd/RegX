name: regx

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: regx
      POSTGRES_USER: regx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regx"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: regx.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DB_HOST: postgres
      DB_NAME: regx
      DB_USER: regx
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
    volumes:
      - document_storage:/app/document_storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/regx/v1/health/')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A regx worker --loglevel=info
    environment:
      DJANGO_SETTINGS_MODULE: regx.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DB_HOST: postgres
      DB_NAME: regx
      DB_USER: regx
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
    volumes:
      - document_storage:/app/document_storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  document_storage:
