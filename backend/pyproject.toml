[tool.ruff]
target-version = "py312"
line-length = 100
src = [".", "regx", "common", "identity", "tenancy", "authorization", "audit", "workflows", "documents", "templates_registry", "fda_data", "formulations", "iid_assessment"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "S",         # bandit security
    "B",         # bugbear
    "A",         # flake8-builtins
    "C4",        # flake8-comprehensions
    "UP",        # pyupgrade
    "RUF",       # ruff-specific
]
ignore = [
    "S101",   # assert in tests
    "S106",   # hardcoded-password-func-arg (test fixtures)
    "B008",   # do-not-perform-function-call-in-argument-defaults (DRF views)
    "RUF012", # Django Meta/class attributes are intentionally mutable class vars
    "N818",   # Django exception naming convention differs from PEP 8 (no -Error suffix)
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S", "N802", "N806", "E501"]
"*/migrations/*" = ["N806", "E501", "RUF012", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["common", "identity", "tenancy", "authorization", "audit", "workflows", "documents", "templates_registry", "fda_data", "formulations", "iid_assessment", "iig_checklist", "regulatory_cases", "submission_dossiers", "dossier_blueprints", "regx"]
known-third-party = ["django", "rest_framework", "drf_spectacular", "celery", "cryptography", "pyotp", "decouple", "filetype", "pypdf", "docx", "openpyxl", "pptx"]

[tool.importlinter]
root_packages = ["common", "identity", "tenancy", "authorization", "audit", "workflows", "documents", "templates_registry", "fda_data", "formulations", "iid_assessment", "iig_checklist", "regulatory_cases", "submission_dossiers", "dossier_blueprints", "dossier_upgrades", "submission_operations", "submission_packages", "external_integrations", "demo_seed"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "common-has-no-domain-imports"
type = "forbidden"
source_modules = ["common"]
forbidden_modules = ["identity", "tenancy", "authorization", "audit", "workflows", "documents", "templates_registry", "fda_data", "formulations", "iid_assessment", "iig_checklist", "AIDatabase"]

[[tool.importlinter.contracts]]
name = "no-aidatabase-imports-anywhere"
type = "forbidden"
source_modules = [
    "common", "identity", "tenancy", "authorization", "audit", "workflows", "documents", "templates_registry",
    "fda_data", "formulations", "iid_assessment", "iig_checklist",
    "regulatory_cases", "submission_dossiers", "dossier_blueprints"
]
forbidden_modules = ["AIDatabase"]

[[tool.importlinter.contracts]]
name = "templates_registry-no-legacy-django-apps"
type = "forbidden"
source_modules = ["templates_registry"]
forbidden_modules = ["RATools", "AdminMaster", "RAAI", "AIDatabase"]

[[tool.importlinter.contracts]]
name = "identity-no-tenancy"
type = "forbidden"
source_modules = ["identity"]
forbidden_modules = ["tenancy", "authorization", "AIDatabase"]

[[tool.importlinter.contracts]]
name = "fda-iid-foundation-no-legacy-django-apps"
type = "forbidden"
source_modules = ["fda_data", "formulations", "iid_assessment", "iig_checklist"]
forbidden_modules = ["RATools", "AdminMaster", "RAAI", "AIDatabase"]

[[tool.importlinter.contracts]]
name = "fda-data-is-platform-level-not-coupled-to-tenant-formulations"
type = "forbidden"
source_modules = ["fda_data"]
forbidden_modules = ["formulations", "iid_assessment"]

[[tool.importlinter.contracts]]
name = "iig-checklist-content-is-not-imported-by-governed-domains"
type = "forbidden"
source_modules = ["fda_data", "formulations", "iid_assessment", "documents"]
forbidden_modules = ["iig_checklist"]

# dossier_upgrades is the outermost layer: it reads a blueprint and writes an
# existing dossier, and nothing may depend on it. A section must not know it can
# be upgraded, and a blueprint must not know a dossier was moved onto it --
# otherwise "publishing a version changes no dossier" stops being structural.
[[tool.importlinter.contracts]]
name = "dossier-upgrades-is-the-outermost-layer"
type = "forbidden"
source_modules = [
    "common",
    "identity",
    "tenancy",
    "authorization",
    "audit",
    "workflows",
    "documents",
    "templates_registry",
    "iig_checklist",
    "regulatory_cases",
    "submission_dossiers",
    "dossier_blueprints",
]
forbidden_modules = ["dossier_upgrades"]

[[tool.importlinter.contracts]]
name = "dossier-upgrades-no-legacy-django-apps"
type = "forbidden"
source_modules = ["dossier_upgrades"]
forbidden_modules = ["RATools", "AdminMaster", "RAAI", "AIDatabase"]

# submission_operations is a read model. It depends on every governed domain it
# aggregates and NOTHING may depend on it: the moment a domain imports the
# dashboard, the dashboard has become a source of truth rather than a view of
# one, and deleting it would stop being free.
[[tool.importlinter.contracts]]
name = "nothing-depends-on-submission-operations"
type = "forbidden"
source_modules = [
    "common",
    "identity",
    "tenancy",
    "authorization",
    "audit",
    "workflows",
    "documents",
    "templates_registry",
    "iig_checklist",
    "regulatory_cases",
    "submission_dossiers",
    "dossier_blueprints",
    "dossier_upgrades",
]
forbidden_modules = ["submission_operations"]

[[tool.importlinter.contracts]]
name = "submission-operations-no-legacy-django-apps"
type = "forbidden"
source_modules = ["submission_operations"]
forbidden_modules = ["RATools", "AdminMaster", "RAAI", "AIDatabase"]

# A package composes the document platform; the document platform must never
# learn about packages. The deletion-protection registry exists precisely so
# that arrow stays one-way, and this makes it a build failure rather than a
# convention.
[[tool.importlinter.contracts]]
name = "nothing-depends-on-submission-packages"
type = "forbidden"
source_modules = [
    "common",
    "identity",
    "tenancy",
    "authorization",
    "audit",
    "workflows",
    "documents",
    "templates_registry",
    "iig_checklist",
    "regulatory_cases",
    "submission_dossiers",
    "dossier_blueprints",
    "dossier_upgrades",
    "submission_operations",
]
forbidden_modules = ["submission_packages"]

[[tool.importlinter.contracts]]
name = "submission-packages-no-legacy-django-apps"
type = "forbidden"
source_modules = ["submission_packages"]
forbidden_modules = ["RATools", "AdminMaster", "RAAI", "AIDatabase"]

# External integrations is an EDGE, not a domain. It is allowed to depend on the
# domains -- it transfers their content -- but nothing may depend on it. A domain
# that imported the connector layer would acquire an outbound network dependency
# it never asked for, and the arrow that keeps that from happening should be a
# build failure rather than a convention.
[[tool.importlinter.contracts]]
# `demo_seed` is a composition root, not a layer. It assembles a demonstrable
# environment out of every domain, so it necessarily imports across all of
# them -- which is only safe because the dependency runs one way. Nothing may
# import it back: a domain that reached into demo seeding would be taking a
# runtime dependency on test-shaped data.
name = "nothing-depends-on-demo-seed"
type = "forbidden"
source_modules = [
    "common",
    "identity",
    "tenancy",
    "authorization",
    "audit",
    "workflows",
    "documents",
    "templates_registry",
    "fda_data",
    "formulations",
    "iid_assessment",
    "iig_checklist",
    "regulatory_cases",
    "submission_dossiers",
    "dossier_blueprints",
    "dossier_upgrades",
    "submission_operations",
    "submission_packages",
    "external_integrations",
]
forbidden_modules = ["demo_seed"]

[[tool.importlinter.contracts]]
name = "nothing-depends-on-external-integrations"
type = "forbidden"
source_modules = [
    "common",
    "identity",
    "tenancy",
    "authorization",
    "audit",
    "workflows",
    "documents",
    "templates_registry",
    "iig_checklist",
    "regulatory_cases",
    "submission_dossiers",
    "dossier_blueprints",
    "dossier_upgrades",
    "submission_operations",
    "submission_packages",
]
forbidden_modules = ["external_integrations"]

[[tool.importlinter.contracts]]
name = "external-integrations-no-legacy-django-apps"
type = "forbidden"
source_modules = ["external_integrations"]
forbidden_modules = ["RATools", "AdminMaster", "RAAI", "AIDatabase"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "regx.settings.test"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-fail-under=55",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests requiring live DB",
]
