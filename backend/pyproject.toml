[tool.ruff]
target-version = "py312"
line-length = 100
src = [".", "regx", "common", "identity", "tenancy", "authorization", "audit", "workflows", "documents", "templates_registry"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "S",         # bandit security
    "B",         # bugbear
    "A",         # flake8-builtins
    "C4",        # flake8-comprehensions
    "UP",        # pyupgrade
    "RUF",       # ruff-specific
]
ignore = [
    "S101",   # assert in tests
    "S106",   # hardcoded-password-func-arg (test fixtures)
    "B008",   # do-not-perform-function-call-in-argument-defaults (DRF views)
    "RUF012", # Django Meta/class attributes are intentionally mutable class vars
    "N818",   # Django exception naming convention differs from PEP 8 (no -Error suffix)
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S", "N802", "N806", "E501"]
"*/migrations/*" = ["N806", "E501", "RUF012", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["common", "identity", "tenancy", "authorization", "audit", "workflows", "documents", "templates_registry", "regx"]
known-third-party = ["django", "rest_framework", "drf_spectacular", "celery", "cryptography", "pyotp", "decouple", "filetype", "pypdf", "docx", "openpyxl", "pptx"]

[tool.importlinter]
root_packages = ["common", "identity", "tenancy", "authorization", "audit", "workflows", "documents", "templates_registry"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "common-has-no-domain-imports"
type = "forbidden"
source_modules = ["common"]
forbidden_modules = ["identity", "tenancy", "authorization", "audit", "workflows", "documents", "templates_registry", "AIDatabase"]

[[tool.importlinter.contracts]]
name = "no-aidatabase-imports-anywhere"
type = "forbidden"
source_modules = [
    "common", "identity", "tenancy", "authorization", "audit", "workflows", "documents", "templates_registry"
]
forbidden_modules = ["AIDatabase"]

[[tool.importlinter.contracts]]
name = "templates_registry-no-legacy-django-apps"
type = "forbidden"
source_modules = ["templates_registry"]
forbidden_modules = ["RATools", "AdminMaster", "RAAI", "AIDatabase"]

[[tool.importlinter.contracts]]
name = "identity-no-tenancy"
type = "forbidden"
source_modules = ["identity"]
forbidden_modules = ["tenancy", "authorization", "AIDatabase"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "regx.settings.test"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-fail-under=55",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests requiring live DB",
]
