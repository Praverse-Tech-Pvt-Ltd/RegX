# Single-origin front door for the integrated REGX + company site.
#
# Routing rule (docs/BOOKING_FINAL_REGX_INTEGRATION_PLAN.md §5):
#   * an explicit allow-list of REGX operational prefixes -> Next.js frontend
#   * /api/... -> REGX DRF backend
#   * /static/ and /media/ -> the copied company asset trees, off disk
#   * EVERYTHING ELSE -> the company Django site, verbatim
#
# The default route belongs to the company site on purpose: the company owns
# 347 routes across three apps, and any path not claimed below must keep
# behaving exactly as it does in the original project.

# Kept so a WebSocket/HMR upgrade passes through untouched while a plain
# request does not send a stray "Connection: upgrade".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream company_site  { server company_site:8000; }
upstream regx_frontend { server frontend:3000; }
upstream regx_backend  { server backend:8000; }

server {
    listen 8080;
    server_name _;

    # Company document/image uploads are larger than nginx's 1m default.
    client_max_body_size 64m;

    # Inherited by every location block below.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # The company homepage and Audit IQ build pandas dataframes over the
    # FDA-483 dataset; the default 60s read timeout truncates a cold load.
    proxy_read_timeout 120s;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---------------------------------------------------------------------
    # Company static and media, served directly off the copied trees
    # (486 MB + 199 MB). Django's urls.py only serves these when DEBUG is
    # on, so nginx owns them in every environment.
    # ---------------------------------------------------------------------
    location ^~ /static/ {
        alias /srv/company/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /media/ {
        alias /srv/company/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------
    # REGX API — unchanged, still authoritative for identity, MFA, tenancy,
    # permissions, audit and every protected operation.
    # ---------------------------------------------------------------------
    location ^~ /api/ {
        proxy_pass http://regx_backend;
    }

    # ---------------------------------------------------------------------
    # REGX operational UI (Next.js). Next's own asset and RSC traffic first.
    # ---------------------------------------------------------------------
    location ^~ /_next/            { proxy_pass http://regx_frontend; }
    # The frontend's own copy of the company design system (CSS, icon fonts,
    # logo) that dresses the operational pages in the /ratools/ shell. It is
    # NOT the company site's /static/ tree above — deliberately a distinct
    # prefix so the two never shadow each other.
    location ^~ /regx-shell/       { proxy_pass http://regx_frontend; }

    location ^~ /signin            { proxy_pass http://regx_frontend; }
    location ^~ /mfa               { proxy_pass http://regx_frontend; }
    location ^~ /dashboard         { proxy_pass http://regx_frontend; }
    location ^~ /documents         { proxy_pass http://regx_frontend; }
    location ^~ /fda-data          { proxy_pass http://regx_frontend; }
    location ^~ /formulations      { proxy_pass http://regx_frontend; }
    location ^~ /iid-assessments   { proxy_pass http://regx_frontend; }
    location ^~ /iig-checklists    { proxy_pass http://regx_frontend; }
    location ^~ /migration-batches { proxy_pass http://regx_frontend; }
    location ^~ /templates         { proxy_pass http://regx_frontend; }
    location ^~ /template-sources  { proxy_pass http://regx_frontend; }
    location ^~ /tenants           { proxy_pass http://regx_frontend; }
    location ^~ /workflows         { proxy_pass http://regx_frontend; }

    # ---------------------------------------------------------------------
    # Administration is NOT served here. /adminmaster/ and /admin/ listen on
    # 8090 instead (see the second server block), so the admin surface can be
    # firewalled, IP-restricted or bound to an internal interface without
    # touching the public listener.
    #
    # 404 rather than a redirect: a redirect would advertise where the admin
    # console lives to anyone probing the public origin.
    # ---------------------------------------------------------------------
    location ^~ /adminmaster/ { return 404; }
    location ^~ /admin/       { return 404; }

    # ---------------------------------------------------------------------
    # The company website owns everything else: /, /ratools/ (including the
    # original RegX landing), /aidatabase/, /about-alpesh/, /termsofuse/,
    # /privacy-policy/ and the rest.
    # ---------------------------------------------------------------------
    location / {
        proxy_pass http://company_site;
    }
}

# -------------------------------------------------------------------------
# Admin listener. Same upstreams, different port, deliberately narrow.
#
# Only the two admin prefixes are routed. Everything else returns 404, so this
# listener cannot be used as a second way into the application if it is ever
# exposed more widely than intended.
#
# Static and media are served here too: the admin templates reference the same
# /static/ tree as the rest of the company site, and without them the console
# renders unstyled.
# -------------------------------------------------------------------------
server {
    listen 8090;
    server_name _;

    client_max_body_size 64m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;

    location = /healthz {
        access_log off;
        return 200 "ok
";
        add_header Content-Type text/plain;
    }

    location ^~ /static/ {
        alias /srv/company/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /media/ {
        alias /srv/company/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /adminmaster/ { proxy_pass http://company_site; }
    location ^~ /admin/       { proxy_pass http://company_site; }

    # Anything else on the admin port is not an admin path.
    location / { return 404; }
}
