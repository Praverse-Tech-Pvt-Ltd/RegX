services:
  - type: web
    name: booking-demo-final
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn RAAI.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: PYTHON_VERSION
        value: "3.12.7"
